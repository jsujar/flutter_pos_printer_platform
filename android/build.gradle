group 'com.sersoluciones.flutter_pos_printer_platform'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Subido de 31 a 34: el codigo necesita referenciar Build.VERSION_CODES.TIRAMISU
    // y Context.RECEIVER_NOT_EXPORTED, constantes que no existen compilando contra 31.
    // `targetSdkVersion` se deja como estaba: en una libreria no gobierna el
    // comportamiento en tiempo de ejecucion, lo hace el targetSdk de la app.
    compileSdkVersion 34

    namespace 'com.sersoluciones.flutter_pos_printer_platform'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 31
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
