group 'com.sersoluciones.flutter_pos_printer_platform'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Raised from 31 to 34: the code references Build.VERSION_CODES.TIRAMISU and
    // Context.RECEIVER_NOT_EXPORTED, constants that do not exist when compiling
    // against 31. `targetSdkVersion` is left alone on purpose: in a library it
    // does not govern runtime behaviour -- the host app's targetSdk does.
    compileSdkVersion 34

    namespace 'com.sersoluciones.flutter_pos_printer_platform'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 31
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
